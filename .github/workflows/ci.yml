name: Android checks
on:
  push:
    branches: [main, 'chore/**', 'feature/**', 'fix/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: microsoft
          java-version: '21'
      - name: Android SDK packages
        run: '"${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"'
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: microsoft
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Audit source and test diagnostic tooling
        run: |
          python tools/check_repository.py
          python -m unittest discover -s tests -v
      - name: Verify Wrapper JAR
        run: sha256sum --check tools/gradle-wrapper.sha256
      - name: Test, lint and build both variants
        working-directory: android-app
        run: >-
          ./gradlew --no-daemon --console=plain --max-workers=2
          -PgitCommit=${GITHUB_SHA}
          :app:testDebugUnitTest :app:lintDebug :app:lintRelease
          :app:assembleDebug :app:assembleRelease :app:assembleSmoke :app:assembleSmokeAndroidTest
      - name: Prevent new lint findings
        run: |
          python tools/check_lint.py android-app/app/build/reports/lint-results-debug.xml
          python tools/check_lint.py android-app/app/build/reports/lint-results-release.xml
      - name: Save test reports and unsigned release
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: checks-${{ github.sha }}
          retention-days: 14
          path: |
            android-app/app/build/reports/
            android-app/app/build/test-results/
            android-app/app/build/outputs/apk/release/*-unsigned.apk
            android-app/app/build/outputs/apk/androidTest/
