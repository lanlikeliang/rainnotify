name: Windows release readiness
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: microsoft
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: SDK and script validation
        shell: pwsh
        run: |
          & sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
          if ($LASTEXITCODE) { throw 'SDK installation failed' }
          Get-ChildItem tools -Filter *.ps1 | ForEach-Object {
            $parseErrors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$null,[ref]$parseErrors)
            if ($parseErrors) { throw $parseErrors }
          }
          python tools/check_repository.py
          if ($LASTEXITCODE) { throw 'Repository audit failed' }
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE) { throw 'Python tests failed' }
      - name: Wrapper builds using public script interface
        shell: pwsh
        run: |
          ./tools/build_android.ps1 -Variant Debug -Lint -UnitTests
          ./tools/build_android.ps1 -Variant Release -Lint
          python tools/check_lint.py android-app/app/build/reports/lint-results-debug.xml
          if ($LASTEXITCODE) { throw 'Debug lint regression' }
          python tools/check_lint.py android-app/app/build/reports/lint-results-release.xml
          if ($LASTEXITCODE) { throw 'Release lint regression' }
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-${{ github.sha }}
          retention-days: 14
          path: android-app/app/build/reports/
